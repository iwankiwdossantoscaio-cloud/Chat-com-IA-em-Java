# ============================================================
#  Configurações da aplicação IA Chat
# ============================================================

# Porta do servidor (padrão 8080)
server.port=8080

# Cole aqui a sua API Key da Anthropic
# Obtenha em: https://console.anthropic.com/
anthropic.api.key=SUA_API_KEY_AQUI

# Modelo Claude usado
anthropic.model=claude-sonnet-4-20250514

# Máximo de tokens na resposta
anthropic.max-tokens=1000

# Nome da aplicação
spring.application.name=ia-chat

# Desativa banner desnecessário
spring.main.banner-mode=console

# Log nível (use DEBUG para depurar)
logging.level.com.iachat=INFO
